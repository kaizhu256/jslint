<tspan
    lengthAdjust="spacingAndGlyphs"
    textLength="768"
    x="10"
    y="230"
>&gt; // Autofix whitespace-warnings in &lt;source&gt; in javascript. No fs, no cli -                      </tspan>
<tspan
    lengthAdjust="spacingAndGlyphs"
    textLength="768"
    x="10"
    y="252"
>&gt; // &lt;autofixed&gt; is the repaired source, or undefined if nothing was written,                    </tspan>
<tspan
    lengthAdjust="spacingAndGlyphs"
    textLength="768"
    x="10"
    y="274"
>&gt; // and &lt;warnings&gt; and &lt;ok&gt; then describe &lt;autofixed&gt;, not &lt;source&gt;.                            </tspan>
<tspan
